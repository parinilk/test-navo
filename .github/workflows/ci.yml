# =============================================================================
# LOCAL DEVELOPMENT SETUP
# =============================================================================
# 
# To enable local testing, run these commands in your terminal:
# 
# Frontend Testing:
# cd src/frontend
# npm install
# npm run lint
# npm run type-check
# npm test
# npm run build
# 
# Backend Testing:
# cd src/backend
# pip install -r requirements.txt
# pip install -r requirements-dev.txt
# flake8 .
# black --check .
# mypy .
# pytest
# 
# Integration Testing:
# # Start backend in one terminal:
# cd src/backend
# uvicorn main:app --reload
# 
# # Start frontend in another terminal:
# cd src/frontend
# npm run dev
# 
# # Run E2E tests in a third terminal:
# cd src/frontend
# npx playwright test
# 
