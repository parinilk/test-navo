services:
  - type: web
    name: navo-backend
    env: python
    buildCommand: cd src/backend && pip install -r requirements.txt
    startCommand: cd src/backend && bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONPATH
        value: "/opt/render/project/src/backend"
      # Add your environment variables here
      - key: MONGODB_URL
        sync: false  # Set this in Render dashboard
      - key: MONGODB_DB_NAME
        value: "Navo_data"
      - key: PINECONE_API_KEY
        sync: false  # Set this in Render dashboard
      - key: PINECONE_ENVIRONMENT
        sync: false  # Set this in Render dashboard
      - key: PINECONE_INDEX_NAME
        value: "navo-products"
      - key: AZURE_OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: AZURE_OPENAI_ENDPOINT
        sync: false  # Set this in Render dashboard
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false  # Set this in Render dashboard
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-02-15-preview"
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        sync: false  # Set this in Render dashboard
      - key: ALLOWED_ORIGINS
        value: "https://test-navo-jsyb.vercel.app/,http://localhost:3000,http://localhost:5173"  # Update with your actual Vercel URL
      - key: LOG_LEVEL
        value: "INFO"
      - key: JWT_SECRET_KEY
        sync: false  # Set this in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set this in Render dashboard
      # Web Search API Keys (optional - for enhanced web search functionality)
      - key: SERP_API_KEY
        sync: false  # Optional: Set this in Render dashboard for SERP API
      - key: BING_SEARCH_API_KEY
        sync: false  # Optional: Set this in Render dashboard for Bing Search
      - key: SCRAPER_API_KEY
        sync: false  # Optional: Set this in Render dashboard for ScraperAPI
      - key: GOOGLE_API_KEY
        sync: false  # Optional: Set this in Render dashboard for Google Search
      - key: GOOGLE_CSE_ID
        sync: false  # Optional: Set this in Render dashboard for Google Custom Search
